<style>
body{max-width:1440px;margin:24px auto;padding:0 24px;font:16px/1.55 'Segoe UI',Arial;background:#f4f7fb;color:#20324b}h1{font-size:30px;line-height:1.2}h2{font-size:24px}h3{font-size:18px}button,select,input{font:inherit;box-sizing:border-box;border:1px solid #b1bfd0;border-radius:7px;background:white;color:#20324b;padding:9px 12px}button,a,select{cursor:pointer}button:focus,a:focus,input:focus,select:focus{outline:3px solid #3879c0;outline-offset:2px}.toolbar{padding:18px;background:white;border:1px solid #d6e0eb;border-radius:12px;margin:18px 0}.toolbar label{display:inline-block;margin:5px 12px 5px 0}.toolbar input{width:320px;max-width:100%}.tabs{margin:18px 0}.tabs button{margin:4px 6px 4px 0}.tabs button.active{background:#205e9e;color:white;border-color:#205e9e}.tabpane{display:none}.tabpane.active{display:block}.badge{border-radius:9px;padding:14px 20px}.source{border-radius:10px;padding:20px;margin:14px 0}.message{border-left:5px solid #8a9bb1}.message[data-results=pozytywny]{border-left-color:#24815c}.message[data-results=negatywny]{border-left-color:#bc3f42}.message[data-results=niewykonane]{border-left-color:#a77915}.thread{margin:16px 0;border:1px solid #cbd7e5;border-radius:12px;background:white;padding:18px}.thread h3{margin:4px 0}.pill{display:inline-block;border-radius:20px;background:#e8eef5;padding:4px 12px;font-size:14px;margin:8px 6px 8px 0}.pill.pozytywny{background:#ddf1e6;color:#216248}.pill.negatywny{background:#fbe3e4;color:#943239}.pill.niewykonane{background:#fff0d0;color:#795714}.message-body{display:none}.message.open .message-body{display:block}.thread-body{display:none}.thread.open .thread-body{display:block}.source:target{outline:3px solid #337bbf}.graph-scroll{overflow:auto;max-height:680px;border:1px solid #d1dce9;border-radius:8px;background:#fafcff;margin:12px 0}.model-svg{display:block;margin:auto;min-width:650px}.model-svg text{font:15px 'Segoe UI',Arial;fill:#20324b}.model-svg a:hover rect{stroke:#174d86;stroke-width:3}.graph-tools{margin:10px 0}.graph-tools button{margin-right:6px}.explain{background:#eef4fc;border-left:4px solid #3e7cb8;padding:12px 18px}.empty{padding:24px;background:#fff3d8;border-radius:8px}.countbar{font-weight:600;margin-top:12px}#q,#q+button,#q+button+button,#licznik{display:none}table{font-size:14px}blockquote{font-size:15px}.evidence{display:none}.show-evidence .evidence{display:block}pre{max-height:600px;overflow:auto} .methods-scroll{overflow:auto}.methods-scroll table{min-width:740px}@media(max-width:750px){body{padding:0 12px}.toolbar label{display:block}.toolbar input{width:100%}.branch td{display:block;width:auto}}@media print{.toolbar,.tabs,.graph-tools,.toggle{display:none}.tabpane,.thread-body,.message-body,.evidence{display:block!important}.graph-scroll{max-height:none;overflow:visible}.thread,.source{break-inside:avoid}}
</style>
<script>
(function(){
'use strict';
var doc=document, names={pozytywny:'Pozytywne',negatywny:'Negatywne',niewykonane:'Niewykonane',brak:'Brak wyniku FIN'}, order={pozytywny:0,negatywny:1,niewykonane:2,brak:3}, current='grafy';
function el(tag,cls,text){var n=doc.createElement(tag);if(cls)n.className=cls;if(text!=null)n.appendChild(doc.createTextNode(text));return n;}
function array(list){return Array.prototype.slice.call(list);}
function text(n){return n.textContent||n.innerText||'';}
function btn(label,fn,cls){var b=el('button',cls||'',label);b.type='button';b.onclick=fn;return b;}
function active(n,yes,cls){n.className=n.className.replace(new RegExp('(?:^|\\s)'+cls+'(?=\\s|$)','g'),'')+(yes?' '+cls:'');}
function result(n){return (n.getAttribute('data-results')||'brak').split(' ');}
function pills(n){var box=el('div');result(n).forEach(function(v){box.appendChild(el('span','pill '+v,names[v]||v));});return box;}
var headings=['decyzje','metody','grafy','zrodla'], titles=['Decyzje i odmowy','Porównanie metod','Modele decyzyjne','Wiadomości źródłowe'], panes={};
headings.forEach(function(id){var h=doc.getElementById(id),p=el('div','tabpane');p.id='panel-'+id;h.parentNode.insertBefore(p,h);p.appendChild(h);while(p.nextSibling&&!(p.nextSibling.tagName==='H2')&&p.nextSibling.tagName!=='SCRIPT'&&p.nextSibling.tagName!=='STYLE')p.appendChild(p.nextSibling);panes[id]=p;});
var bar=el('div','toolbar'), tabs=el('div','tabs');tabs.setAttribute('role','tablist');
var search=el('input');search.id='report-search';search.placeholder='Szukaj treści, projektu lub agenta…';search.setAttribute('aria-label','Szukaj w modelach i wiadomościach');
var filter=el('select');filter.id='report-result';filter.setAttribute('aria-label','Filtr wyniku');
[['','Wszystkie wyniki'],['pozytywny','Pozytywne'],['negatywny','Negatywne'],['niewykonane','Niewykonane'],['brak','Brak wyniku FIN']].forEach(function(v){var o=el('option','',v[1]);o.value=v[0];filter.appendChild(o);});
var sort=el('select');sort.id='report-sort';sort.setAttribute('aria-label','Kolejność');
[['new','Najnowsze najpierw'],['old','Najstarsze najpierw'],['result','Według wyniku FIN']].forEach(function(v){var o=el('option','',v[1]);o.value=v[0];sort.appendChild(o);});
function label(t,input){var l=el('label','',t+' ');l.appendChild(input);bar.appendChild(l);}
label('Szukaj',search);label('Wynik',filter);label('Sortuj',sort);
bar.appendChild(btn('Wyczyść filtry',function(){search.value='';filter.value='';sort.value='new';apply();}));
var counts=el('div','countbar');counts.id='report-counts';counts.setAttribute('aria-live','polite');bar.appendChild(counts);
bar.appendChild(el('p','muted','Filtry i sortowanie dotyczą modeli oraz wiadomości. W modelach wynik pochodzi z FIN wątku; przy wiadomości dotyczy jej własnego FIN. Wątek może zawierać kilka różnych wyników.'));
var first=panes.decyzje;first.parentNode.insertBefore(bar,first);first.parentNode.insertBefore(tabs,first);
function show(id){current=id;headings.forEach(function(x){active(panes[x],x===id,'active');var b=doc.getElementById('tab-'+x);active(b,x===id,'active');b.setAttribute('aria-selected',x===id?'true':'false');});}
headings.forEach(function(id,i){var b=btn(titles[i],function(){show(id);});b.id='tab-'+id;b.setAttribute('role','tab');b.setAttribute('aria-controls','panel-'+id);tabs.appendChild(b);});
var threads=array(doc.querySelectorAll('.thread')), messages=array(doc.querySelectorAll('.message'));
var containers={};
[['grafy',threads],['zrodla',messages]].forEach(function(v){var c=el('div');c.id='items-'+v[0];panes[v[0]].appendChild(c);v[1].forEach(function(n){c.appendChild(n);n._search=text(n).toLowerCase();});containers[v[0]]=c;});
var empty={};['grafy','zrodla'].forEach(function(id){empty[id]=el('p','empty','Brak pozycji spełniających filtry. Zmień kryteria lub wyczyść filtry.');panes[id].appendChild(empty[id]);});
function rank(n){return Math.min.apply(null,result(n).map(function(r){return order[r]==null?3:order[r];}));}
function sorted(items){return items.slice().sort(function(a,b){var x=a.getAttribute('data-time')||'',y=b.getAttribute('data-time')||'';if(sort.value==='result'&&rank(a)!==rank(b))return rank(a)-rank(b);return (sort.value==='old'?1:-1)*(x<y?-1:x>y?1:0);});}
function apply(){var q=search.value.toLowerCase(),r=filter.value,tot=[];[['grafy',threads],['zrodla',messages]].forEach(function(pair){var n=0;sorted(pair[1]).forEach(function(item){var yes=(!q||item._search.indexOf(q)>=0)&&(!r||result(item).indexOf(r)>=0);item.style.display=yes?'':'none';if(yes)n++;containers[pair[0]].appendChild(item);});empty[pair[0]].style.display=n?'none':'';tot.push(n+' / '+pair[1].length);});counts.innerText='Modele: '+tot[0]+' · Wiadomości: '+tot[1];}
search.oninput=apply;filter.onchange=apply;sort.onchange=apply;
messages.forEach(function(m){var h=m.querySelector('h3'),body=el('div','message-body');while(h.nextSibling)body.appendChild(h.nextSibling);var toggle=btn('Rozwiń wiadomość',function(){var yes=m.className.indexOf(' open')<0;active(m,yes,'open');toggle.innerText=yes?'Zwiń wiadomość':'Rozwiń wiadomość';toggle.setAttribute('aria-expanded',yes?'true':'false');},'toggle');toggle.setAttribute('aria-expanded','false');m.appendChild(pills(m));m.appendChild(toggle);m.appendChild(body);m._toggle=toggle;});
function svgEl(tag,attrs,txt){var n=doc.createElementNS('http://www.w3.org/2000/svg',tag);Object.keys(attrs||{}).forEach(function(k){n.setAttribute(k,attrs[k]);});if(txt)n.appendChild(doc.createTextNode(txt));return n;}
function short(s,n){return s.length>n?s.substring(0,n-1)+'…':s;}
function draw(thread,host){
var nodes=array(thread.querySelectorAll('.evidence .node')),main=nodes.filter(function(n){return (' '+n.className+' ').indexOf(' hyp ')<0;}),alternatives=nodes.filter(function(n){return (' '+n.className+' ').indexOf(' hyp ')>=0;}),height=main.length*130+220;
var svg=svgEl('svg',{viewBox:'0 0 960 '+height,width:'960',height:height,'class':'model-svg',role:'img','aria-label':'Model decyzyjny z odnośnikami do wiadomości'});
var markerId='arrow-'+thread._index,defs=svgEl('defs'),marker=svgEl('marker',{id:markerId,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'});marker.appendChild(svgEl('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#6c819c'}));defs.appendChild(marker);svg.appendChild(defs);
function edge(d,dash,label,x,y){var p=svgEl('path',{d:d,fill:'none',stroke:'#6c819c','stroke-width':2,'marker-end':'url(#'+markerId+')'});if(dash)p.setAttribute('stroke-dasharray','7 5');svg.appendChild(p);if(label)svg.appendChild(svgEl('text',{x:x,y:y,'text-anchor':'middle'},label));}
function node(n,x,y,width,hyp){var link=n.querySelector('a'),g=svgEl(link?'a':'g',{}),title=text(n.querySelector('b')||n),detail=text(n.querySelector('div')||n).replace(/\s+/g,' ').trim();if(link){g.setAttribute('href',link.getAttribute('href'));g.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href',link.getAttribute('href'));g.setAttribute('tabindex','0');g.setAttribute('aria-label',title+' — otwórz wiadomość źródłową');}
var isDecision=(' '+n.className+' ').indexOf(' decision ')>=0;
var shape=isDecision?svgEl('polygon',{points:(x+width/2)+','+(y-6)+' '+(x+width)+','+(y+43)+' '+(x+width/2)+','+(y+92)+' '+x+','+(y+43),fill:'#e5effb',stroke:'#537ca9','stroke-width':2}):svgEl('rect',{x:x,y:y,width:width,height:86,rx:12,fill:hyp?'#fff3dc':'#ffffff',stroke:hyp?'#b58932':'#7793b1','stroke-width':2});if(hyp)shape.setAttribute('stroke-dasharray','7 5');g.appendChild(shape);g.appendChild(svgEl('title',{},title+'\n'+detail));g.appendChild(svgEl('text',{x:x+width/2,y:y+31,'text-anchor':'middle','font-weight':'600'},short(title,isDecision?48:55)));g.appendChild(svgEl('text',{x:x+width/2,y:y+57,'text-anchor':'middle'},short(detail,isDecision?50:57)));svg.appendChild(g);}
main.forEach(function(n,i){var y=20+i*130;if(i)edge('M 480 '+(y-44)+' L 480 '+(y-7),false,'',0,0);node(n,160,y,640,false);});
var splitY=main.length*130+20;if(main.length){edge('M 480 '+(splitY-44)+' L 480 '+(splitY-22)+' L 235 '+(splitY-22)+' L 235 '+(splitY+24),true,'TAK',270,splitY-28);edge('M 480 '+(splitY-44)+' L 480 '+(splitY-22)+' L 725 '+(splitY-22)+' L 725 '+(splitY+24),true,'NIE',690,splitY-28);}
alternatives.slice(0,2).forEach(function(n,i){node(n,i?505:15,splitY+32,440,true);});host.appendChild(svg);return svg;
}
threads.forEach(function(t,i){t._index=i;var h=t.querySelector('h3'),body=el('div','thread-body'),evidence=el('div','evidence');while(h.nextSibling)evidence.appendChild(h.nextSibling);var toggle=btn('Otwórz model decyzyjny',function(){var yes=t.className.indexOf(' open')<0;active(t,yes,'open');toggle.innerText=yes?'Zwiń model':'Otwórz model decyzyjny';toggle.setAttribute('aria-expanded',yes?'true':'false');if(yes&&!t._svg)t._svg=draw(t,graph);},'toggle');toggle.setAttribute('aria-expanded','false');t.appendChild(pills(t));t.appendChild(el('p','muted','Ostatnia aktywność: '+(t.getAttribute('data-time')||'').replace(/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/,'$1-$2-$3 $4:$5:$6')));t.appendChild(toggle);var tools=el('div','graph-tools'),scale=1;function zoom(d){scale=Math.max(.5,Math.min(2,scale+d));if(t._svg){t._svg.style.width=(960*scale)+'px';t._svg.style.height=(parseFloat(t._svg.getAttribute('height'))*scale)+'px';}}tools.appendChild(btn('− Pomniejsz',function(){zoom(-.25);}));tools.appendChild(btn('+ Powiększ',function(){zoom(.25);}));tools.appendChild(btn('Pokaż / ukryj dowody tekstowe',function(){active(body,body.className.indexOf('show-evidence')<0,'show-evidence');}));body.appendChild(tools);body.appendChild(el('p','explain','Prostokąt: wiadomość lub działanie. Romb: ocena dostępnych danych. Strzałka ciągła: kolejność zapisów, nie dowód przyczynowości. Przerywana: proponowana ścieżka do sprawdzenia. Kliknij węzeł zawierający źródło, aby przeczytać wiadomość.'));var graph=el('div','graph-scroll');body.appendChild(graph);body.appendChild(evidence);t.appendChild(body);});
var methodTable=panes.metody.querySelector('table');if(methodTable){var wrap=el('div','methods-scroll');methodTable.parentNode.insertBefore(wrap,methodTable);wrap.appendChild(methodTable);}
function source(id){var m=doc.getElementById(id);if(!m)return;if((' '+m.className+' ').indexOf(' message ')>=0){search.value='';filter.value='';apply();show('zrodla');active(m,true,'open');m._toggle.innerText='Zwiń wiadomość';m._toggle.setAttribute('aria-expanded','true');m.scrollIntoView();}}
doc.onclick=function(e){e=e||window.event;var a=e.target||e.srcElement;while(a&&String(a.tagName).toLowerCase()!=='a')a=a.parentNode;if(!a)return;var href=a.getAttribute('href')||a.getAttribute('xlink:href');if(!href||href.charAt(0)!=='#')return;var id=href.substring(1);if(panes[id]){show(id);panes[id].scrollIntoView();}else source(id);};
window.onhashchange=function(){source(window.location.hash.substring(1));};
show('grafy');apply();if(window.location.hash)source(window.location.hash.substring(1));
})();
</script>
