<script>
(function(){
'use strict';
var doc=document, names={pozytywny:'Pozytywne',negatywny:'Negatywne',niewykonane:'Niewykonane',brak:'Brak wyniku FIN'}, order={pozytywny:0,negatywny:1,niewykonane:2,brak:3}, current='grafy';

var shape=isDecision?svgEl('polygon',{points:(x+width/2)+','+(y-6)+' '+(x+width)+','+(y+43)+' '+(x+width/2)+','+(y+92)+' '+x+','+(y+43),fill:'#e5effb',stroke:'#537ca9','stroke-width':2}):svgEl('rect',{x:x,y:y,width:width,height:86,rx:12,fill:hyp?'#fff3dc':'#ffffff',stroke:hyp?'#b58932':'#7793b1','stroke-width':2});if(hyp)shape.setAttribute('stroke-dasharray','7 5');g.appendChild(shape);g.appendChild(svgEl('title',{},title+'\n'+detail));g.appendChild(svgEl('text',{x:x+width/2,y:y+31,'text-anchor':'middle','font-weight':'600'},short(title,isDecision?48:55)));g.appendChild(svgEl('text',{x:x+width/2,y:y+57,'text-anchor':'middle'},short(detail,isDecision?50:57)));svg.appendChild(g);}

alternatives.slice(0,2).forEach(function(n,i){node(n,i?505:15,splitY+32,440,true);});host.appendChild(svg);return svg;
}
threads.forEach(function(t,i){t._index=i;var h=t.querySelector('h3'),body=el('div','thread-body'),evidence=el('div','evidence');while(h.nextSibling)evidence.appendChild(h.nextSibling);var toggle=btn('Otwórz model decyzyjny',function(){var yes=t.className.indexOf(' open')<0;active(t,yes,'open');toggle.innerText=yes?'Zwiń model':'Otwórz model decyzyjny';toggle.setAttribute('aria-expanded',yes?'true':'false');if(yes&&!t._svg)t._svg=draw(t,graph);},'toggle');toggle.setAttribute('aria-expanded','false');t.appendChild(pills(t));t.appendChild(el('p','muted','Ostatnia aktywność: '+(t.getAttribute('data-time')||'').replace(/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/,'$1-$2-$3 $4:$5:$6')));t.appendChild(toggle);var tools=el('div','graph-tools'),scale=1;function zoom(d){scale=Math.max(.5,Math.min(2,scale+d));if(t._svg){t._svg.style.width=(960*scale)+'px';t._svg.style.height=(parseFloat(t._svg.getAttribute('height'))*scale)+'px';}}tools.appendChild(btn('− Pomniejsz',function(){zoom(-.25);}));tools.appendChild(btn('+ Powiększ',function(){zoom(.25);}));tools.appendChild(btn('Pokaż / ukryj dowody tekstowe',function(){active(body,body.className.indexOf('show-evidence')<0,'show-evidence');}));body.appendChild(tools);body.appendChild(el('p','explain','Prostokąt: wiadomość lub działanie. Romb: ocena dostępnych danych. Strzałka ciągła: kolejność zapisów, nie dowód przyczynowości. Przerywana: proponowana ścieżka do sprawdzenia. Kliknij węzeł zawierający źródło, aby przeczytać wiadomość.'));var graph=el('div','graph-scroll');body.appendChild(graph);body.appendChild(evidence);t.appendChild(body);});

function source(id){var m=doc.getElementById(id);if(!m)return;if((' '+m.className+' ').indexOf(' message ')>=0){search.value='';filter.value='';apply();show('zrodla');active(m,true,'open');m._toggle.innerText='Zwiń wiadomość';m._toggle.setAttribute('aria-expanded','true');m.scrollIntoView();}}

<style>
.variant-editor{margin:18px 0;padding:20px;border:2px solid #607ba2;border-radius:12px;background:#f6f9ff}.variant-editor label{display:block;margin:10px 0}.variant-editor input,.variant-editor textarea,.variant-editor select{font:inherit;max-width:100%;padding:8px;border:1px solid #acbcd0;border-radius:6px}.variant-editor textarea{display:block;width:95%;min-height:75px}.variant-editor button{margin:5px}.variant-editor .variant-canvas{overflow:auto;max-height:650px;background:white}.variant-editor svg text{font:15px 'Segoe UI',Arial;fill:#20324b}.variant-status{font-weight:600}.variant-editor svg [role=button]{cursor:pointer}

<script>
(function(){
'use strict';
var d=document,ns='http://www.w3.org/2000/svg';
function make(tag,parent,value){var e=d.createElement(tag);if(value!=null)e.textContent=value;if(parent)parent.appendChild(e);return e;}
function button(parent,title,fn){var b=make('button',parent,title);b.type='button';b.onclick=fn;return b;}
function field(parent,title,tag){var l=make('label',parent,title+' '),e=make(tag||'input',l);e.setAttribute('aria-label',title);return e;}
function svg(tag,attrs,parent,value){var e=d.createElementNS(ns,tag);Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k]);});if(value)e.textContent=value;parent.appendChild(e);return e;}
function list(items){return Array.prototype.slice.call(items);}
list(d.querySelectorAll('.thread')).forEach(function(t,index){

button(host,'Edytuj wariant grafu',function(){if(opened){box.hidden=!box.hidden;return;}opened=true;box.hidden=false;start();});
var box=make('section',host);box.className='variant-editor';box.hidden=true;
function start(){

var identity=JSON.stringify([t.querySelector('h3').textContent,sourceIds]),key='ecxp-graph-variant-v1:'+identity;
var data={format:'ecxp-graph-variant',version:1,origin:identity,title:'Wariant alternatywny',nodes:[],edges:[]},selected='',serial=0;
var lastMain='',alternative=0;

make('h3',box,'Warsztat rozwiązań — wariant roboczy');
make('p',box,'Edytujesz własny plan, niezależny od zapisu pracy agentów. Połączenia początkowe są szkicem do zmiany. Dodaj alternatywy, warunki TAK/NIE, testy lub pomysł na narzędzie. Statusy oznaczają Twoją ocenę, nie wynik analizy wiadomości.');
var title=field(box,'Nazwa wariantu');title.value=data.title;title.oninput=function(){data.title=title.value;dirty();};
var status=make('p',box,'Niezapisany wariant. Pobierz JSON, aby zachować go poza przeglądarką.');status.className='variant-status';status.setAttribute('role','status');

var storage=make('div',box);
button(storage,'Zapisz w tej przeglądarce',function(){try{localStorage.setItem(key,JSON.stringify(data));status.textContent='Zapisano lokalnie w tej przeglądarce. JSON pozwala przenieść wariant na inne stanowisko.';}catch(e){status.textContent='Przeglądarka nie udostępnia zapisu lokalnego. Użyj Pobierz JSON.';}});
function valid(v){if(!v||v.format!=='ecxp-graph-variant'||v.version!==1||v.origin!==identity||typeof v.title!=='string'||v.title.length>500||!Array.isArray(v.nodes)||!Array.isArray(v.edges)||v.nodes.length>500||v.edges.length>2000)throw Error('Nieprawidłowy plik lub wariant innego grafu.');var ids={};v.nodes.forEach(function(n){if(!n||typeof n.id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(n.id)||ids[n.id]||typeof n.title!=='string'||n.title.length>500||typeof n.note!=='string'||n.note.length>20000||['step','decision','tool','test'].indexOf(n.kind)<0||['hipoteza','do testu','potwierdzone','odrzucone'].indexOf(n.status)<0||typeof n.source!=='string'||(n.source&&sourceIds.indexOf(n.source)<0))throw Error('Nieprawidłowy węzeł.');ids[n.id]=true;});v.edges.forEach(function(e){if(!e||!ids[e.from]||!ids[e.to]||typeof e.label!=='string'||e.label.length>200)throw Error('Nieprawidłowe połączenie.');});return v;}
function load(raw){data=valid(JSON.parse(raw));title.value=data.title;selected='';refresh();status.textContent='Wczytano wariant roboczy. Oryginalne wiadomości pozostają bez zmian.';}
button(storage,'Wczytaj zapis lokalny',function(){try{var raw=localStorage.getItem(key);if(!raw)throw Error('Brak zapisu w tej przeglądarce.');load(raw);}catch(e){status.textContent=e.message;}});
button(storage,'Pobierz JSON',function(){try{var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=make('a',box);a.href=url;a.download='wariant-grafu-'+index+'.json';a.click();box.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},1000);status.textContent='Przekazano wariant do pobrania jako JSON.';}catch(e){status.textContent='Nie udało się pobrać: '+e.message;}});
var upload=field(storage,'Importuj wariant JSON','input');upload.type='file';upload.accept='.json,application/json';upload.onchange=function(){var file=upload.files[0];if(!file)return;if(file.size>2000000){status.textContent='Plik jest zbyt duży (limit 2 MB).';return;}var reader=new FileReader();reader.onload=function(){try{load(reader.result);}catch(e){status.textContent='Import odrzucony: '+e.message;}upload.value='';};reader.onerror=function(){status.textContent='Nie udało się odczytać pliku.';};reader.readAsText(file);};

var name=field(box,'Opis kroku'),kind=field(box,'Rodzaj','select'),outcome=field(box,'Ocena autora wariantu','select'),note=field(box,'Uzasadnienie, metoda, oczekiwany wynik i kryterium testu','textarea');
